<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Fuchsi im Sternenwald</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1f5e;touch-action:none;overscroll-behavior:none;
  font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a3f9a,#171a4d)}
#stage{position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.45)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:#fff;border:0;cursor:pointer;touch-action:manipulation}

.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.7em;text-align:center;color:#fff}
.ov.on{display:flex;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
h1{margin:0;font-size:4.4em;line-height:.95;text-shadow:0 .06em 0 #d9480f,0 .12em 0 rgba(0,0,0,.28),0 0 .6em rgba(0,0,0,.25)}
h1 small{display:block;font-size:.4em;margin-top:.25em;color:#fff7cc;text-shadow:0 .08em 0 rgba(0,0,0,.3)}
h2{margin:0;font-size:2.4em;text-shadow:0 .07em 0 rgba(0,0,0,.35)}
.big{font-size:1.9em;padding:.32em 1.3em;border-radius:1em;background:linear-gradient(#ffb43a,#ff7a1a);
  box-shadow:0 .14em 0 #c2540b,0 .3em .5em rgba(0,0,0,.3);text-shadow:0 .05em 0 rgba(0,0,0,.2)}
.big:active{transform:translateY(.1em);box-shadow:0 .04em 0 #c2540b}
.mid{font-size:1.25em;padding:.3em 1em;border-radius:.9em;background:linear-gradient(#5db7ff,#2f86e8);
  box-shadow:0 .12em 0 #1b5bb0,0 .25em .4em rgba(0,0,0,.25)}
.mid:active{transform:translateY(.08em);box-shadow:0 .03em 0 #1b5bb0}
.row{display:flex;gap:.7em;flex-wrap:wrap;justify-content:center}
.hint{margin:.3em 1.5em 0;font-size:.95em;color:#fff;opacity:.95;text-shadow:0 .08em 0 rgba(0,0,0,.45);max-width:34em;line-height:1.35}
#cards{display:grid;grid-template-columns:repeat(5,auto);gap:.7em;margin:.2em 0 .4em}
.card{width:7.6em;height:6.4em;border-radius:1em;border:.12em solid #fff;position:relative;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.4em .2em .35em;
  box-shadow:0 .18em 0 rgba(0,0,0,.3),0 .4em .7em rgba(0,0,0,.3);transition:transform .12s}
.card:active{transform:scale(.96)}
.card .num{font-size:2.1em;line-height:1;text-shadow:0 .06em 0 rgba(0,0,0,.35)}
.card .nm{font-size:.8em;text-shadow:0 .07em 0 rgba(0,0,0,.45)}
.med i{font-size:1em}
.med i,.stars i{font-style:normal;color:rgba(40,40,100,.45);font-size:1.5em}
.med i.on,.stars i.on{color:#ffd23f;text-shadow:0 .05em 0 #c98a00}
.stars i{font-size:3em;margin:0 .05em;display:inline-block}
.stars i.on{animation:bounce .6s ease-out both}
.stars i:nth-child(2).on{animation-delay:.2s}.stars i:nth-child(3).on{animation-delay:.4s}
@keyframes bounce{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.35) rotate(8deg)}100%{transform:scale(1)}}
#winInfo{font-size:1.3em;text-shadow:0 .07em 0 rgba(0,0,0,.4)}
.dim{background:rgba(20,22,80,.55);backdrop-filter:blur(3px)}

input{-webkit-user-select:text;user-select:text}
#nameIn{font:inherit;font-size:1.5em;width:9em;padding:.25em .6em;border-radius:.8em;border:.1em solid #fff;background:rgba(255,255,255,.95);color:#27306b;text-align:center;outline:none}
#nameIn:focus{box-shadow:0 0 0 .15em #ffd23f}
.big.sm{font-size:1.5em}
#finInfo{font-size:1.3em;text-shadow:0 .07em 0 rgba(0,0,0,.4)}
#scoreList{width:27em;max-width:94%;background:rgba(255,255,255,.14);border-radius:1em;padding:.35em .5em}
.sc{display:grid;grid-template-columns:2.2em 1fr 4.6em 3.8em;gap:.4em;align-items:center;padding:.16em .4em;border-radius:.6em;text-align:left;font-size:1em}
.sc span:nth-child(3),.sc span:nth-child(4){text-align:right}
.sc.me{background:rgba(255,210,63,.4)}
.sc .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scoreNote{font-size:1em;min-height:1.2em;text-shadow:0 .07em 0 rgba(0,0,0,.4)}
.empty{padding:1em;font-size:1.05em}
#hudBtns .off{opacity:.45}
#hudBtns{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:10px;z-index:6}
#hudBtns button{width:clamp(40px,7vmin,56px);height:clamp(40px,7vmin,56px);border-radius:50%;background:rgba(30,30,90,.55);
  font-size:clamp(15px,3.2vmin,24px);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.5)}
#btnPause{display:none}
body[data-state=play] #btnPause{display:flex}

#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
body.touch[data-state=play] #touch{display:block}
#touch button{pointer-events:auto;position:absolute;bottom:max(18px,env(safe-area-inset-bottom));
  width:clamp(64px,17vmin,120px);height:clamp(64px,17vmin,120px);border-radius:50%;
  background:rgba(255,255,255,.26);border:3px solid rgba(255,255,255,.75);font-size:clamp(26px,7vmin,48px);
  color:#fff;touch-action:none;display:flex;align-items:center;justify-content:center;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#touch [data-k=left]{left:max(18px,env(safe-area-inset-left))}
#touch [data-k=right]{left:calc(max(18px,env(safe-area-inset-left)) + clamp(64px,17vmin,120px) + 18px)}
#touch [data-k=jump]{right:max(18px,env(safe-area-inset-right));width:clamp(80px,21vmin,140px);height:clamp(80px,21vmin,140px);background:rgba(255,160,50,.5)}
#touch button.down{background:rgba(255,255,255,.6)}

#rotate{position:fixed;inset:0;z-index:20;background:#1b1f5e;color:#fff;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;font-size:22px;text-align:center;padding:24px}
#rotate .ic{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style>
</head>
<body data-state="menu">
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div class="ov on" id="ovMenu">
      <h1>Fuchsi<small>im Sternenwald</small></h1>
      <button class="big" id="bPlay">▶ Abenteuer starten</button>
      <div class="row">
        <button class="mid" id="bPick">Welten üben</button>
        <button class="mid" id="bScores">🏆 Bestenliste</button>
        <button class="mid" id="bNew">↺ Neues Abenteuer</button>
      </div>
      <p class="hint" id="hintTxt"></p>
    </div>

    <div class="ov dim" id="ovLevels">
      <h2 style="font-size:2em">Welten üben</h2>
      <p class="hint" style="margin:0">Hier kannst du jede Welt frei üben. Für die Bestenliste spiele das Abenteuer.</p>
      <div id="cards"></div>

        <button class="big sm" id="bSubmit">🏆 Eintragen</button>

        <button class="mid" id="bAgain">↺ Nochmal</button>

</div>

<div id="hudBtns"><button id="btnMusic" aria-label="Musik an/aus">🎵</button><button id="btnMute" aria-label="Ton an/aus">🔊</button><button id="btnPause" aria-label="Pause">❚❚</button></div>
<div id="touch">
  <button data-k="left" aria-label="Links">◀</button>
  <button data-k="right" aria-label="Rechts">▶</button>

</div>
<div id="rotate"><div class="ic">📱</div><div>Bitte drehe dein Gerät<br>ins Querformat.</div></div>

<script>
(()=>{
'use strict';
/* ====================================================================
   Fuchsi im Sternenwald – ein Jump and Run für Kinder ab 6
   ==================================================================== */
const TS=48, VW=960, VH=528, ROWS=11;
const RUN=270, GRAV=1900, JUMP=700, MAXFALL=900;
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const stage=$('stage'), cv=$('cv'), ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const hash=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n);};
const ov=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
let K=1;

/* ---------------- Speicher ---------------- */
let save={best:{},muted:false,noMusic:false,run:null,scores:[],lastName:''};
try{const s=JSON.parse(localStorage.getItem('fuchsi_save')||'null');if(s)save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem('fuchsi_save',JSON.stringify(save));}catch(e){}}

/* ---------------- Ton ---------------- */
let ac=null;
function unlockAudio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  if(ac)musicStart();
}
function tone(f,d,type,v,f2,when){
  if(!ac||save.muted)return;
  try{
    const t=ac.currentTime+(when||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
const sfx={
  jump(){tone(380,.18,'square',.05,780);},
  land(){tone(140,.08,'sine',.08,80);},
  star(){tone(880,.09,'triangle',.12);tone(1320,.15,'triangle',.12,null,.07);},
  stomp(){tone(300,.14,'square',.07,90);tone(520,.1,'triangle',.08,null,.05);},
  hurt(){tone(320,.35,'sawtooth',.07,90);},
  spring(){tone(280,.35,'sine',.16,1000);},
  heart(){tone(520,.1,'triangle',.12);tone(780,.1,'triangle',.12,null,.09);tone(1040,.16,'triangle',.12,null,.18);},
  cp(){tone(660,.12,'triangle',.12);tone(990,.2,'triangle',.12,null,.1);},
  win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.28,'triangle',.13,null,i*.12));}
};

/* ---------------- Musik (ruhig, live erzeugt) ---------------- */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MOODS=[
  {bpm:76,shift:0,ch:'major'},   // sonnig
  {bpm:70,shift:2,ch:'major'},   // Abend
  {bpm:62,shift:0,ch:'minor'},   // Nacht
  {bpm:82,shift:5,ch:'major'}    // frisch
];
const CHORDS={
  major:{bars:[{b:48,p:[52,55,59,64]},{b:43,p:[55,59,62,64]},{b:45,p:[57,60,64,67]},{b:41,p:[53,57,60,64]}],
         sc:[60,62,64,67,69,72,74,76,79]},
  minor:{bars:[{b:45,p:[52,55,59,60]},{b:41,p:[53,57,60,64]},{b:48,p:[52,55,60,64]},{b:43,p:[50,55,59,62]}],
         sc:[57,60,62,64,67,69,72,74,76]}
};
const MOOD_OF_THEME=[0,1,2,3,1,3,1,0];
const music={timer:null,next:0,slot:0,mood:0,pats:[[],[],[],[]],idx:4,bus:null,master:null};
function musicBus(){
  if(music.bus||!ac)return;
  const m=ac.createGain();m.gain.value=.5;m.connect(ac.destination);
  const inp=ac.createGain(),dly=ac.createDelay(1),fb=ac.createGain(),lp=ac.createBiquadFilter(),wet=ac.createGain();
  dly.delayTime.value=.42;fb.gain.value=.34;lp.type='lowpass';lp.frequency.value=2200;wet.gain.value=.38;
  inp.connect(m);inp.connect(dly);dly.connect(lp);lp.connect(fb);fb.connect(dly);lp.connect(wet);wet.connect(m);
  music.bus=inp;music.master=m;
}
function musicGen(){
  const prob=[.85,.25,.55,.3,.75,.25,.5,.3],n=CHORDS[MOODS[music.mood].ch].sc.length;
  for(let b=0;b<4;b++){
    if(music.pats[b].length&&Math.random()<.5)continue;
    const pat=[];
    for(let s=0;s<8;s++){
      if(Math.random()<prob[s]){
        music.idx=clamp(music.idx+[-2,-1,-1,0,1,1,2][(Math.random()*7)|0],0,n-1);
        pat.push(music.idx);
      }else pat.push(-1);
    }
    music.pats[b]=pat;
  }
}
function mPad(m,t,dur){
  const f=mtof(m),g=ac.createGain(),lp=ac.createBiquadFilter(),o1=ac.createOscillator(),o2=ac.createOscillator();
  lp.type='lowpass';lp.frequency.value=900;
  o1.type='sine';o1.frequency.value=f;o2.type='triangle';o2.frequency.value=f*1.003;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.03,t+.9);
  g.gain.setValueAtTime(.03,t+dur-.3);g.gain.exponentialRampToValueAtTime(.0001,t+dur+1.2);
  o1.connect(lp);o2.connect(lp);lp.connect(g);g.connect(music.bus);
  o1.start(t);o2.start(t);o1.stop(t+dur+1.3);o2.stop(t+dur+1.3);
}
function mBass(m,t,dur){
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=mtof(m);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.11,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+dur*.92);
  o.connect(g);g.connect(music.bus);o.start(t);o.stop(t+dur);
}
function mPluck(m,t){
  const f=mtof(m),o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),g2=ac.createGain();
  o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.25;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.075,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(music.bus);
  o.start(t);o2.start(t);o.stop(t+1.15);o2.stop(t+1.15);
}
function musicSlot(slot,t){
  const mo=MOODS[music.mood],ch=CHORDS[mo.ch],bar=Math.floor(slot/8)%4,s=slot%8,eighth=60/mo.bpm/2;
  if(s===0){
    if(bar===0)musicGen();
    const c=ch.bars[bar],dur=eighth*8;
    for(const n of c.p)mPad(n+mo.shift,t,dur);
    mBass(c.b+mo.shift,t,dur);
  }
  const ix=music.pats[bar][s];
  if(ix>=0)mPluck(ch.sc[ix]+mo.shift,t);
}
function musicTick(){
  if(!ac||!music.bus||ac.state!=='running')return;
  const eighth=60/MOODS[music.mood].bpm/2;
  if(music.next<ac.currentTime)music.next=ac.currentTime+.1;
  while(music.next<ac.currentTime+.6){musicSlot(music.slot,music.next);music.next+=eighth;music.slot++;}
}
function musicStart(){
  if(!ac||music.timer||save.muted||save.noMusic)return;
  musicBus();
  try{music.master.gain.cancelScheduledValues(ac.currentTime);music.master.gain.setTargetAtTime(.5,ac.currentTime,.1);}catch(e){}
  music.next=ac.currentTime+.2;
  music.timer=setInterval(musicTick,150);
}
function musicStop(){
  if(music.timer){clearInterval(music.timer);music.timer=null;}
  if(ac&&music.master){try{music.master.gain.setTargetAtTime(0,ac.currentTime,.08);}catch(e){}}
}
function musicMood(n){
  if(music.mood===n)return;
  music.mood=n;music.slot=0;music.pats=[[],[],[],[]];
  if(ac)music.next=ac.currentTime+.4;
}
const moodFor=th=>MOOD_OF_THEME[TH.indexOf(th)]||0;

/* ---------------- Hilfsfunktionen Zeichnen ---------------- */
function rr(x,y,w,h,a,b){
  if(b===undefined)b=a;
  ctx.beginPath();ctx.moveTo(x+a,y);ctx.lineTo(x+w-b,y);ctx.arcTo(x+w,y,x+w,y+b,b);
  ctx.lineTo(x+w,y+h-b);ctx.arcTo(x+w,y+h,x+w-b,y+h,b);ctx.lineTo(x+a,y+h);
  ctx.arcTo(x,y+h,x,y+h-a,a);ctx.lineTo(x,y+a);ctx.arcTo(x,y,x+a,y,a);ctx.closePath();
}
function starPath(cx,cy,R,r,rot){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=(rot||0)-Math.PI/2+i*Math.PI/5,d=i%2?r:R;
    ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*d,cy+Math.sin(a)*d);}
  ctx.closePath();
}
function heartPath(cx,cy,s){
  ctx.beginPath();ctx.moveTo(cx,cy+s*.9);
  ctx.bezierCurveTo(cx-s*1.7,cy-s*.1,cx-s*.9,cy-s*1.15,cx,cy-s*.35);
  ctx.bezierCurveTo(cx+s*.9,cy-s*1.15,cx+s*1.7,cy-s*.1,cx,cy+s*.9);ctx.closePath();
}

/* ---------------- Welten-Themen ---------------- */
const TH=[
 {sky:['#6cc8ff','#e6f8ff'],sun:{c:'#fff4a8',x:.8,y:.2,r:44},cloud:'#ffffff',hill1:'#a6e6b0',hill2:'#7ccf8d',tree:'#52b06c',
  grass:'#62d85c',grassDk:'#3fae48',dirt:'#a8744a',dirtDk:'#8a5a37',slime:'#6fe06f',plank:'#c98f52'},
 {sky:['#ff8fa3','#ffe2a8'],sun:{c:'#fff0c4',x:.28,y:.5,r:64},cloud:'#ffe6e6',hill1:'#d3a6e0',hill2:'#a47fc4',tree:'#7a58a8',
  grass:'#a6dc5c',grassDk:'#7bb53f',dirt:'#a8705f',dirtDk:'#8a5648',slime:'#ff9fd0',plank:'#c98f52'},
 {sky:['#171a5a','#5b52b0'],sun:{c:'#fffbe0',x:.75,y:.22,r:38},night:true,cloud:'#7f7ac8',hill1:'#4b4aa0',hill2:'#363585',tree:'#2a2a6e',
  grass:'#4fd1b5',grassDk:'#35a58f',dirt:'#4e4c8c',dirtDk:'#3b3a74',slime:'#9fe8ff',plank:'#9b7ad0'},
 // 3 Schneeland
 {sky:['#a8d8ff','#f3fbff'],sun:{c:'#fffbe0',x:.2,y:.2,r:36},snow:true,trees:'pine',cloud:'#ffffff',hill1:'#dff1ff',hill2:'#bcdcf5',tree:'#8fb8d6',
  grass:'#f4fbff',grassDk:'#b7d8ee',dirt:'#7f8fb5',dirtDk:'#66769c',slime:'#8fe3ff',plank:'#b88955'},

/* ---------------- Level-Baukasten ---------------- */
function build(W,th,name,fn){
  const g=[];for(let y=0;y<ROWS;y++)g.push(new Array(W).fill(' '));
  const L={W,th,name,g,stars:[],enemies:[],hearts:[],springs:[],cps:[],start:{x:2,y:7},flag:W-5};
  const A={
    ground(x0,x1,top){for(let x=x0;x<x1&&x<W;x++)for(let y=top;y<ROWS;y++)g[y][x]='#';},
    plat(x,y,len){for(let i=0;i<len;i++)if(x+i<W&&g[y][x+i]===' ')g[y][x+i]='=';},
    stars(x,y,n,dx,dy){dx=dx===undefined?1:dx;dy=dy||0;
      for(let i=0;i<n;i++)L.stars.push({x:(x+i*dx+.5)*TS,y:(y+i*dy+.5)*TS,ph:i*.7+x,got:false});},
    slime(x,row){L.enemies.push({t:'slime',tx:x,row,w:36,h:30,x:x*TS+6,y:row*TS-30,dir:Math.random()<.5?-1:1,dead:-1,wob:Math.random()*6});},
    bee(x,y,range){L.enemies.push({t:'bee',bx:x*TS+TS/2,by:y*TS,range:range*TS,w:34,h:30,x:x*TS,y:y*TS,dir:1,dead:-1,ph:Math.random()*6});},
    heart(x,y){L.hearts.push({x:(x+.5)*TS,y:(y+.5)*TS,got:false});},
    spring(x,row){L.springs.push({x:x*TS,row,t:0});},
    cp(x,row){L.cps.push({x,row,on:false});}
  };
  fn(A,L);
  L.flagTop=8;for(let y=0;y<ROWS;y++)if(g[y][L.flag]==='#'){L.flagTop=y;break;}
  const solid=(x,y)=>x>=0&&x<W&&y>=0&&y<ROWS&&g[y][x]==='#';
  for(const e of L.enemies)if(e.t==='slime'){
    let l=e.tx,r=e.tx;
    while(r-e.tx<4&&solid(r+1,e.row)&&!solid(r+1,e.row-1))r++;
    while(e.tx-l<4&&solid(l-1,e.row)&&!solid(l-1,e.row-1))l--;
    e.min=l*TS;e.max=(r+1)*TS-e.w;
  }
  return L;
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genLevel(i,th,name){
  const d=clamp(.15+.85*(i-3)/11,0,1),W=96+Math.round(d*52);
  return build(W,th,name,(A)=>{
    const R=mulberry(4242+i*7919),ri=(a,b)=>a+Math.floor(R()*(b-a+1));
    const pSlime=.35+.45*d,pBee=.08+.4*d,pPit=.24+.2*d;
    let x=12,top=8,sinceCp=14,sinceHeart=0;
    A.ground(0,12,8);A.stars(4,7,4);
    const flat=(len)=>{
      A.ground(x,x+len,top);sinceCp+=len;sinceHeart+=len;
      const spring=len>=8&&R()<.22;
      if(spring){A.spring(x+2,top-1);A.plat(x+3,top-4,3);A.stars(x+3,top-5,3);}
      A.stars(x+(spring?5:1),top-1,Math.max(0,Math.min(len-(spring?6:2),4)));
      if(!spring&&len>=6&&R()<pSlime){
        const sx=x+ri(2,len-3);A.slime(sx,top);
        if(d>.5&&len>=10&&R()<.5)A.slime(sx<x+5?x+len-3:x+2,top);
      }
      if(R()<pBee)A.bee(x+ri(2,len-2),top-3,ri(2,3));
      if(!spring&&len>=6&&R()<.3){const px=x+ri(1,len-4);A.plat(px,top-2,3);A.stars(px,top-3,3);}
      if(sinceCp>=30&&len>=5){A.cp(x+1,top-1);sinceCp=0;}
      if(sinceHeart>=34&&R()<.7){A.heart(x+(len>>1),top-2);sinceHeart=0;}
      x+=len;
    };
    while(x<W-20){
      if(x>16&&R()<pPit){
        const w=ri(2,d<.3?3:d<.65?5:7);
        if(w<=3){A.stars(x-1,top-2,w+2);}
        else{
          const len=(d>.5&&R()<.5)?1:2,gap=d>.5?2:1;
          let p=x+1,row=top-1-(R()<.4?1:0),lastEnd=x;
          while(p+len<=x+w){A.plat(p,row,len);A.stars(p,row-1,len);lastEnd=p+len;p+=len+gap;row=clamp(row+ri(-1,1),top-3,top-1);}
          if(x+w-lastEnd>2){const pp=x+w-2;A.plat(pp,top-1,2);A.stars(pp,top-2,2);}
          if(w>=5&&R()<pBee)A.bee(x+(w>>1),top-4,2);
        }
        x+=w;sinceCp+=w;
        flat(ri(6,9));
      }else{
        if(R()<.3)top=clamp(top+(R()<.5?-1:1)*ri(1,2),6,8);
        flat(ri(5,9));
      }
    }
    A.ground(x,W,top);A.stars(x+1,top-1,4);
  });
}

/* ---------------- Partikel ---------------- */
function burst(x,y,n,cols,spd,life,grav,star){
  for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-spd,spd),vy:rnd(-spd,spd*.3)-spd*.4,life:life*rnd(.7,1.1),max:life,g:grav,
    c:cols[(Math.random()*cols.length)|0],r:rnd(3,6),star:!!star,rot:rnd(0,6),vr:rnd(-6,6)});
}
function updParts(dt){
  for(const q of parts){q.life-=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;}
  parts=parts.filter(q=>q.life>0);
}
function drawParts(){
  for(const q of parts){
    ctx.globalAlpha=clamp(q.life/q.max*1.5,0,1);ctx.fillStyle=q.c;
    if(q.star){starPath(q.x,q.y,q.r*1.6,q.r*.7,q.rot);ctx.fill();}
    else if(q.conf){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);ctx.fillRect(-q.r,-q.r*.5,q.r*2,q.r);ctx.restore();}
    else{ctx.beginPath();ctx.arc(q.x,q.y,q.r*clamp(q.life/q.max,.3,1),0,TAU);ctx.fill();}
  }
  ctx.globalAlpha=1;
}

/* ---------------- Kollision ---------------- */
function tile(L,tx,ty){
  if(tx<0||tx>=L.W)return '#';
  if(ty<0||ty>=ROWS)return ' ';
  return L.g[ty][tx];
}
function moveX(L,p,dx){
  p.x+=dx;
  const y0=Math.floor(p.y/TS),y1=Math.floor((p.y+p.h-.01)/TS);
  if(dx>0){const tx=Math.floor((p.x+p.w)/TS);
    for(let y=y0;y<=y1;y++)if(tile(L,tx,y)==='#'){p.x=tx*TS-p.w;p.vx=0;break;}}
  else if(dx<0){const tx=Math.floor(p.x/TS);
    for(let y=y0;y<=y1;y++)if(tile(L,tx,y)==='#'){p.x=(tx+1)*TS;p.vx=0;break;}}
}
function moveY(L,p,dy){
  const prevBottom=p.y+p.h;p.y+=dy;p.on=false;
  const x0=Math.floor((p.x+1)/TS),x1=Math.floor((p.x+p.w-1)/TS);
  if(dy>=0){
    const ty=Math.floor((p.y+p.h)/TS);
    for(let x=x0;x<=x1;x++){const t=tile(L,x,ty);
      if(t==='#'||(t==='='&&prevBottom<=ty*TS+1)){p.y=ty*TS-p.h;p.vy=0;p.on=true;break;}}
  }else{
    const ty=Math.floor(p.y/TS);
    for(let x=x0;x<=x1;x++)if(tile(L,x,ty)==='#'){p.y=(ty+1)*TS;p.vy=0;break;}
  }
}

function startLevel(i,mode){
  unlockAudio();
  const lv=LEVELS[i],L=lv.make();
  G={idx:i,mode:mode||'free',L,t:0,cam:0,got:0,total:L.stars.length,toast:null,flash:0,won:false,winT:0,medals:1,
     spawn:{x:L.start.x*TS+10,y:(L.start.y+1)*TS-44},
     p:{x:0,y:0,w:28,h:44,vx:0,vy:0,dir:1,on:false,coyote:0,buf:0,inv:0,hp:3,squash:0,anim:0,stun:0,jumping:false}};
  G.p.x=G.spawn.x;G.p.y=G.spawn.y;
  parts=[];inp.left=inp.right=inp.jump=inp.jumpPressed=false;
  document.querySelectorAll('#touch button').forEach(b=>b.classList.remove('down'));
  setState('play');toast('Welt '+(i+1)+' von '+LEVELS.length+': '+lv.name,2.6);last=performance.now();
  musicMood(moodFor(lv.th));
}
function toast(text,sec){if(G)G.toast={text,t:sec||2,max:sec||2};}

function hurt(fromPit,srcX){
  const p=G.p;
  if(G.won)return;
  if(!fromPit&&p.inv>0)return;
  p.hp--;sfx.hurt();
  if(p.hp<=0)respawn(true);
  else if(fromPit)respawn(false);
  else{p.inv=1.7;p.vy=-420;p.on=false;p.vx=(p.x+p.w/2<srcX?-1:1)*230;p.stun=.25;}
}
function respawn(refill){
  const p=G.p;
  p.x=G.spawn.x;p.y=G.spawn.y;p.vx=p.vy=0;p.inv=1.6;p.stun=0;p.on=false;
  if(refill){p.hp=3;toast('Nicht aufgeben – du schaffst das!',2.2);}
  else toast("Hoppla! Weiter geht's!",1.6);
  G.cam=clamp(p.x-VW*.4,0,G.L.W*TS-VW);G.flash=.6;
}
function winLevel(){
  G.won=true;G.winT=0;sfx.win();
  const m=G.got>=G.total?3:G.got>=G.total*.6?2:1;
  G.medals=m;save.best[G.idx]=Math.max(save.best[G.idx]||0,m);
  if(G.mode==='run'){
    if(!save.run)save.run={cur:0,res:{}};
    save.run.res[G.idx]={s:G.got,t:Math.round(G.t*10)/10};
    save.run.cur=G.idx+1;
  }
  persist();
}
function showWin(){
  if(G.mode==='run'&&G.idx===LEVELS.length-1){showFinish();return;}
  const m=G.medals,last=G.idx===LEVELS.length-1;
  $('winTitle').textContent=m===3?'Super! Alle Sterne!':m===2?'Toll gemacht!':'Geschafft!';
  $('winStars').innerHTML=[1,2,3].map(k=>'<i class="'+(k<=m?'on':'')+'">★</i>').join('');
  $('winInfo').textContent=G.got+' von '+G.total+' Sternen gesammelt'+(last?' · Du hast alle Welten gemeistert!':'');
  $('bNext').style.display=last?'none':'';
  setState('win');
}

/* ---------------- Abenteuer & Bestenliste ---------------- */
function fmtTime(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function runTotals(){
  let s=0,t=0,m=0;
  for(let i=0;i<LEVELS.length;i++){const r=save.run&&save.run.res[i];if(r){s+=r.s;t+=r.t;}m+=STARS[i];}
  return {s,t,m};
}
function runState(){
  if(!save.run)return 'none';
  if(save.run.cur>=LEVELS.length)return 'done';
  return save.run.cur>0?'going':'none';
}
function refreshMenu(){
  const r=runState();
  $('bPlay').textContent=r==='going'?'▶ Weiter (Welt '+(save.run.cur+1)+')':r==='done'?'🏆 Name eintragen':'▶ Abenteuer starten';
  $('bNew').style.display=r==='none'?'none':'';
}
function newRun(){save.run={cur:0,res:{}};persist();startLevel(0,'run');}
function playMain(){
  unlockAudio();
  const r=runState();
  if(r==='going')startLevel(save.run.cur,'run');
  else if(r==='done')showFinish();
  else newRun();
}
function showFinish(){
  const T=runTotals();
  $('finInfo').textContent='⭐ '+T.s+' von '+T.m+' Sternen · Zeit '+fmtTime(T.t);
  $('nameIn').value=save.lastName||'';
  setState('finish');
}
function submitScore(skip){
  if(state!=='finish')return;
  const T=runTotals();let entry=null;
  if(!skip){
    const name=String($('nameIn').value||'').trim().slice(0,12)||'Fuchsi';
    save.lastName=name;
    entry={name,s:T.s,t:Math.round(T.t),m:T.m,d:Date.now()};
    save.scores.push(entry);
    save.scores.sort((a,b)=>b.s-a.s||a.t-b.t);
    save.scores=save.scores.slice(0,50);
  }
  save.run=null;persist();
  openScores(entry);
}
function openScores(hl){
  const box=$('scoreList');box.innerHTML='';
  const arr=save.scores;
  if(!arr.length){
    const p=document.createElement('div');p.className='empty';
    p.textContent='Noch keine Einträge. Schaffe alle '+LEVELS.length+' Welten im Abenteuer!';box.appendChild(p);
  }
  const medal=['🥇','🥈','🥉'];
  arr.slice(0,10).forEach((e,i)=>{
    const row=document.createElement('div');row.className='sc'+(e===hl?' me':'');
    const c=[medal[i]||(i+1)+'.',e.name,'⭐ '+e.s,fmtTime(e.t)];
    c.forEach((txt,k)=>{const sp=document.createElement('span');if(k===1)sp.className='nm2';sp.textContent=txt;row.appendChild(sp);});
    box.appendChild(row);
  });
  const rank=hl?arr.indexOf(hl)+1:0;
  $('scoreNote').textContent=hl?(rank<=10?'Du bist auf Platz '+rank+'! 🎉':'Du bist auf Platz '+rank+'.'):'';
  setState('scores');
}

/* ---------------- Spiel-Update ---------------- */
function step(dt){
  const L=G.L,p=G.p;G.t+=dt;
  const ctrl=!G.won;
  if(inp.jumpPressed){p.buf=.13;inp.jumpPressed=false;}
  p.buf-=dt;p.stun-=dt;p.inv-=dt;
  const ax=(ctrl&&p.stun<=0)?((inp.right?1:0)-(inp.left?1:0)):0;
  const acc=p.on?2600:1800,fr=p.on?2400:500;
  if(ax!==0){
    p.dir=ax;const tv=ax*RUN;
    p.vx=p.vx<tv?Math.min(tv,p.vx+acc*dt):Math.max(tv,p.vx-acc*dt);
  }else{
    p.vx=Math.abs(p.vx)<=fr*dt?0:p.vx-Math.sign(p.vx)*fr*dt;
  }
  if(p.on)p.coyote=.1;else p.coyote-=dt;
  if(ctrl&&p.stun<=0&&p.buf>0&&p.coyote>0){
    p.vy=-JUMP;p.on=false;p.coyote=0;p.buf=0;p.jumping=true;p.squash=-.6;sfx.jump();
    burst(p.x+p.w/2,p.y+p.h,4,['rgba(255,255,255,.8)'],80,.35,200);
  }
  if(p.jumping&&!inp.jump&&p.vy<-240){p.vy=-240;p.jumping=false;}
  if(p.vy>=0)p.jumping=false;
  if(G.won&&p.on&&G.winT>.15){p.vy=-430;p.on=false;p.vx*=.5;}
  if(G.won)p.vx*=Math.pow(.02,dt);

  p.vy=Math.min(p.vy+GRAV*dt,MAXFALL);
  const wasOn=p.on,preVy=p.vy;
  moveX(L,p,p.vx*dt);moveY(L,p,p.vy*dt);
  if(p.on&&!wasOn&&preVy>220){
    p.squash=clamp(preVy/700,.3,.9);sfx.land();
    burst(p.x+p.w/2,p.y+p.h,5,['rgba(255,255,255,.8)'],90,.35,200);
  }
  p.anim+=dt*Math.abs(p.vx)*.07;
  p.squash*=1-Math.min(1,dt*9);

  const tcx=p.x+p.w/2-VW*.42+p.dir*50;
  G.cam+=(tcx-G.cam)*Math.min(1,dt*5);
  G.cam=clamp(G.cam,0,L.W*TS-VW);

  const pcx=p.x+p.w/2,pcy=p.y+p.h/2;
  if(!G.won){
    for(const s of L.stars)if(!s.got&&Math.hypot(s.x-pcx,s.y-pcy)<30){
      s.got=true;G.got++;sfx.star();burst(s.x,s.y,10,['#ffe14d','#fff6b0','#ffb300'],200,.6,500,true);
    }
    for(const h of L.hearts)if(!h.got&&p.hp<3&&Math.hypot(h.x-pcx,h.y-pcy)<30){
      h.got=true;p.hp++;sfx.heart();burst(h.x,h.y,10,['#ff6b8a','#ffb3c1'],200,.6,500);toast('Herz gefunden!',1.4);
    }
    for(const c of L.cps)if(!c.on&&pcx>c.x*TS+TS/2){
      c.on=true;G.spawn={x:c.x*TS+10,y:(c.row+1)*TS-p.h-.1};sfx.cp();
      burst(c.x*TS+24,c.row*TS+10,12,['#3ee0c0','#fff','#ffe14d'],180,.7,400,true);toast('Checkpoint!',1.3);
    }
    for(const s of L.springs)if(p.vy>=0&&ov(p.x,p.y+p.h-10,p.w,10,s.x+4,s.row*TS+16,TS-8,TS-16)){
      p.vy=-1020;p.on=false;p.jumping=false;s.t=.3;sfx.spring();
      burst(s.x+24,s.row*TS+20,8,['#ff5a5a','#fff'],160,.5,500);
    }
  }
  for(const s of L.springs)s.t=Math.max(0,s.t-dt);

  for(const e of L.enemies){
    if(e.dead>=0){e.dead+=dt;continue;}
    if(e.t==='slime'){
      e.x+=e.dir*55*dt;
      if(e.x<e.min){e.x=e.min;e.dir=1;}
      if(e.x>e.max){e.x=e.max;e.dir=-1;}
    }else{
      const a=G.t*1.1+e.ph;
      e.x=e.bx+Math.sin(a)*e.range-e.w/2;e.y=e.by+Math.sin(G.t*2.3+e.ph)*14;e.dir=Math.cos(a)>=0?1:-1;
    }
    if(!G.won&&ov(p.x+2,p.y+3,p.w-4,p.h-3,e.x+3,e.y+2,e.w-6,e.h-2)){
      if(p.vy>40&&(p.y+p.h)-e.y<24){
        e.dead=0;p.vy=inp.jump?-640:-470;p.on=false;p.jumping=false;sfx.stomp();
        burst(e.x+e.w/2,e.y+e.h/2,10,[L.th.slime,'#fff','#ffe14d'],200,.6,500,true);
      }else hurt(false,e.x+e.w/2);
    }
  }
  L.enemies=L.enemies.filter(e=>e.dead<.35);

  if(!G.won&&p.y>VH+60)hurt(true,0);
  if(!G.won&&p.x+p.w>=L.flag*TS+TS*.4)winLevel();
  if(G.won){
    G.winT+=dt;
    if(G.winT<1.6&&Math.random()<dt*60)parts.push({x:G.cam+rnd(0,VW),y:-10,vx:rnd(-40,40),vy:rnd(60,160),life:2.6,max:2.6,g:80,
      c:['#ff6b8a','#ffd23f','#5ad2ff','#7be87b','#fff'][(Math.random()*5)|0],r:rnd(3,6),conf:true,rot:rnd(0,6),vr:rnd(-8,8)});
    if(G.winT>1.2&&state==='play')showWin();
  }
  updParts(dt);
  if(G.toast){G.toast.t-=dt;if(G.toast.t<=0)G.toast=null;}
  G.flash=Math.max(0,G.flash-dt*1.6);
}

function menuStep(dt){
  menu.t+=dt;menu.cam=(menu.cam+210*dt)%((260-24)*TS);
  const f=menu.fox,hop=Math.max(0,Math.sin(menu.t*2.6))**.7*86;
  f.x=menu.cam+150;f.y=8*TS-f.h-hop;f.on=hop<2;f.anim+=dt*210*.07*1.3;
  f.squash*=1-Math.min(1,dt*9);
}

/* ---------------- Zeichnen: Hintergrund ---------------- */
function drawCloud(x,y,s,c){
  ctx.fillStyle=c;ctx.beginPath();
  ctx.moveTo(x+22*s,y);ctx.arc(x,y,22*s,0,TAU);
  ctx.moveTo(x+54*s,y-10*s);ctx.arc(x+26*s,y-10*s,28*s,0,TAU);
  ctx.moveTo(x+78*s,y);ctx.arc(x+56*s,y,22*s,0,TAU);
  ctx.rect(x,y-6*s,56*s,28*s);ctx.fill();
}
function hills(cam,par,base,amp,col,f1,f2){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,VH);
  for(let x=0;x<=VW+10;x+=10){const wx=x+cam*par;ctx.lineTo(x,base+Math.sin(wx*f1)*amp+Math.sin(wx*f2+1.3)*amp*.4);}
  ctx.lineTo(VW+10,VH);ctx.closePath();ctx.fill();
}
function drawBg(th,cam,t){
  const g=ctx.createLinearGradient(0,0,0,VH*.8);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  if(th.night){
    for(let i=0;i<70;i++){
      const x=(((hash(i,1)*VW*1.6-cam*.04)%VW)+VW)%VW,y=hash(i,2)*270,tw=.5+.5*Math.sin(t*2+i);
      ctx.fillStyle='rgba(255,255,255,'+(.3+.55*tw)+')';ctx.fillRect(x,y,2.4,2.4);
    }
  }
  const s=th.sun,sx=s.x*VW,sy=s.y*VH;
  const rg=ctx.createRadialGradient(sx,sy,s.r*.4,sx,sy,s.r*2.6);
  rg.addColorStop(0,th.night?'rgba(255,255,230,.35)':'rgba(255,255,200,.55)');rg.addColorStop(1,'rgba(255,255,200,0)');
  ctx.fillStyle=rg;ctx.fillRect(sx-s.r*3,sy-s.r*3,s.r*6,s.r*6);
  ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(sx,sy,s.r,0,TAU);ctx.fill();
  if(th.night){ctx.fillStyle='rgba(120,120,170,.25)';
    [[-10,-8,9],[12,6,12],[-4,16,6]].forEach(c=>{ctx.beginPath();ctx.arc(sx+c[0],sy+c[1],c[2],0,TAU);ctx.fill();});}
  for(let i=0;i<7;i++){
    const base=i*230+t*8-cam*.15;let x=((base%1600)+1600)%1600-180;
    drawCloud(x,52+((i*73)%140),.8+(i%3)*.25,th.cloud);
  }
  hills(cam,.25,320,36,th.hill1,.004,.011);
  hills(cam,.45,355,28,th.hill2,.006,.015);
  const sp=170,par=.65,first=Math.floor(cam*par/sp)-1;
  ctx.fillStyle=th.tree;
  for(let i=first;i<first+Math.ceil(VW/sp)+3;i++){
    const x=i*sp+hash(i,5)*60-cam*par,h=62+hash(i,9)*50,base=392;
    if(th.trees==='cactus'){
      const ar=h*.22;
      ctx.fillRect(x-6,base-h*.7,12,h*.7);ctx.beginPath();ctx.arc(x,base-h*.7,6,0,TAU);ctx.fill();
      ctx.fillRect(x-16,base-h*.45,10,6);ctx.fillRect(x-16,base-h*.45-ar,6,ar+6);
      ctx.fillRect(x+6,base-h*.35,10,6);ctx.fillRect(x+10,base-h*.35-ar,6,ar+6);
    }else if(th.trees==='pine'||(th.trees!=='round'&&hash(i,3)>.45)){
      for(let k=0;k<3;k++){const w=h*.34*(1-k*.22),top=base-h*.3-k*h*.3;
        ctx.beginPath();ctx.moveTo(x-w,top+h*.32);ctx.lineTo(x,top-h*.1);ctx.lineTo(x+w,top+h*.32);ctx.closePath();ctx.fill();}
      ctx.fillRect(x-4,base-h*.3,8,h*.3);
    }else{
      ctx.beginPath();ctx.arc(x,base-h*.65,h*.34,0,TAU);ctx.arc(x-h*.22,base-h*.48,h*.25,0,TAU);ctx.arc(x+h*.22,base-h*.48,h*.25,0,TAU);ctx.fill();
      ctx.fillRect(x-4,base-h*.5,8,h*.5);
    }
  }
  if(th.snow){
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<46;i++){
      const fx=(((hash(i,11)*VW+Math.sin(t*.8+i)*18-cam*.12)%VW)+VW)%VW,fy=(hash(i,12)*VH+t*(26+hash(i,13)*34))%VH;
      ctx.beginPath();ctx.arc(fx,fy,1.6+hash(i,14)*1.8,0,TAU);ctx.fill();
    }
  }
  const dg=ctx.createLinearGradient(0,VH-110,0,VH);dg.addColorStop(0,'rgba(0,0,0,0)');dg.addColorStop(1,'rgba(10,10,50,.35)');
  ctx.fillStyle=dg;ctx.fillRect(0,VH-110,VW,110);
}

/* ---------------- Zeichnen: Kacheln ---------------- */
function drawTiles(L,cam){
  const th=L.th,x0=Math.max(0,Math.floor(cam/TS)-1),x1=Math.min(L.W-1,Math.floor((cam+VW)/TS)+1);
  for(let ty=0;ty<ROWS;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=L.g[ty][tx];if(c===' ')continue;
    const x=tx*TS,y=ty*TS;
    if(c==='#'){
      const top=!(ty>0&&L.g[ty-1][tx]==='#');
      ctx.fillStyle=ty>=9?th.dirtDk:th.dirt;ctx.fillRect(x,y,TS+1,TS+1);
      ctx.fillStyle=th.dirtDk;ctx.globalAlpha=.45;
      for(let k=0;k<3;k++){const hx=hash(tx,ty*3+k),hy=hash(ty,tx*3+k+7);
        ctx.beginPath();ctx.ellipse(x+6+hx*(TS-12),y+(top?22:6)+hy*(TS-(top?28:12)),3+hx*3,2+hy*2,0,0,TAU);ctx.fill();}
      ctx.globalAlpha=1;
      if(top){
        ctx.fillStyle=th.grassDk;ctx.fillRect(x,y,TS+1,13);
        for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(x+6+i*12,y+13,6.5,0,TAU);ctx.fill();}
        ctx.fillStyle=th.grass;ctx.fillRect(x,y,TS+1,8);
        ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,TS+1,3);
        const hv=hash(tx,99);
        if(hv>.78){
          const col=['#ff6fa5','#ffffff','#ffd23f','#ff9a3d'][(hash(tx,5)*4)|0],fx=x+10+hash(tx,6)*28;
          ctx.strokeStyle='#2f8f3a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(fx,y+1);ctx.lineTo(fx,y-9);ctx.stroke();
          ctx.fillStyle=col;for(let k=0;k<5;k++){const a=k*TAU/5;ctx.beginPath();ctx.arc(fx+Math.cos(a)*3.6,y-11+Math.sin(a)*3.6,2.8,0,TAU);ctx.fill();}
          ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(fx,y-11,2.2,0,TAU);ctx.fill();
        }else if(hv<.2){
          const fx=x+12+hash(tx,8)*24;ctx.fillStyle=th.grassDk;
          for(let k=-1;k<=1;k++){ctx.beginPath();ctx.moveTo(fx+k*5-2,y+2);ctx.lineTo(fx+k*7,y-8-(k===0?3:0));ctx.lineTo(fx+k*5+2,y+2);ctx.fill();}
        }
      }
    }else{
      const l=L.g[ty][tx-1]==='=',r=L.g[ty][tx+1]==='=',xl=l?x:x+1,xr=r?x+TS+1:x+TS-1;
      ctx.fillStyle=th.plank;rr(xl,y,xr-xl,18,l?0:7,r?0:7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(xl+(l?0:5),y+2,xr-xl-(l?0:5)-(r?0:5),3);
      ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(xl,y+14,xr-xl,4);
      if(r){ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x+TS-1,y+2,2,13);}
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(x+TS/2,y+8,2,0,TAU);ctx.fill();
    }
  }
}

function drawStar(s,t){
  const bob=Math.sin(t*3+s.ph)*4,sx=Math.cos(t*2.4+s.ph);

function drawCp(c,t){

function drawGoal(L,t){

function drawSlime(e,th,t){
  const sq=e.dead>=0,k=sq?clamp(1-e.dead/.3,0,1):1,cx=e.x+e.w/2,by=e.y+e.h;

  ctx.fillStyle='#2f6fe0';ctx.beginPath();ctx.moveTo(-4,-38);ctx.lineTo(-24,-30+Math.sin(t*10)*3*(run?1:.3));ctx.lineTo(-22,-40);ctx.lineTo(-4,-44);ctx.closePath();ctx.fill();

  ctx.fillStyle='#3d8bff';rr(-4,-41,24,9,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.35)';rr(-2,-40,20,3,1.5);ctx.fill();
  ctx.fillStyle='#fff1dc';ctx.beginPath();ctx.ellipse(16,-39,11,7.5,0,0,TAU);ctx.fill();
  ctx.fillStyle='#3a2418';ctx.beginPath();ctx.arc(25,-42,3,0,TAU);ctx.fill();
  const blink=(Math.floor(t*10)%38)===0;
  if(blink||blinkOff){ctx.strokeStyle='#3a2418';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(10.5,-47);ctx.lineTo(17.5,-47);ctx.stroke();}
  else{ctx.fillStyle='#3a2418';ctx.beginPath();ctx.ellipse(14,-47,3,3.6,0,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(15,-48.6,1.1,0,TAU);ctx.fill();}
  ctx.fillStyle='rgba(255,110,140,.5)';ctx.beginPath();ctx.arc(7,-40,3.2,0,TAU);ctx.fill();
  ctx.strokeStyle='#3a2418';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(20,-37,3,.2,Math.PI-.4);ctx.stroke();
  ctx.restore();
}

/* ---------------- Zeichnen: Oberfläche ---------------- */
function drawHUD(){
  const p=G.p;
  ctx.fillStyle='rgba(25,28,90,.5)';rr(12,12,262,50,25);ctx.fill();
  for(let i=0;i<3;i++){
    heartPath(44+i*36,36,11);
    if(i<p.hp){ctx.fillStyle='#ff4d73';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();}
    else{ctx.fillStyle='rgba(255,255,255,.15)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.55)';ctx.stroke();}
  }
  starPath(172,37,14,6,0);ctx.fillStyle='#ffd23f';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='800 26px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';
  ctx.textBaseline='middle';ctx.textAlign='left';ctx.fillText(G.got+' / '+G.total,194,38);
}
function drawToast(){
  const T=G.toast;if(!T)return;
  const a=clamp(Math.min(T.t,T.max-T.t)/.35,0,1);
  ctx.save();ctx.globalAlpha=a;
  ctx.font='800 28px ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif';
  const w=ctx.measureText(T.text).width+56;
  ctx.fillStyle='rgba(25,28,90,.7)';rr(VW/2-w/2,86-(1-a)*10,w,52,26);ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(T.text,VW/2,113-(1-a)*10);
  ctx.restore();
}
function drawWorld(){
  const L=G.L,cam=Math.round(G.cam),t=G.t,p=G.p;
  drawBg(L.th,cam,t);
  ctx.save();ctx.translate(-cam,0);
  drawTiles(L,cam);
  for(const s of L.springs)drawSpring(s);
  for(const c of L.cps)drawCp(c,t);
  drawGoal(L,t);
  for(const s of L.stars)if(!s.got&&s.x>cam-40&&s.x<cam+VW+40)drawStar(s,t);
  for(const h of L.hearts)if(!h.got)drawHeartPick(h,t);
  for(const e of L.enemies)if(e.x>cam-80&&e.x<cam+VW+80){if(e.t==='slime')drawSlime(e,L.th,t);else drawBee(e,t);}
  if(!(p.inv>0&&Math.floor(t*14)%2===0))drawFox(p,t,p.inv>1.4);
  drawParts();
  ctx.restore();
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+G.flash*.6+')';ctx.fillRect(0,0,VW,VH);}
  drawHUD();drawToast();
}
function drawMenu(){
  const L=menu.L,cam=Math.round(menu.cam);
  drawBg(L.th,cam,menu.t);
  ctx.save();ctx.translate(-cam,0);
  drawTiles(L,cam);
  for(const s of L.stars)if(s.x>cam-40&&s.x<cam+VW+40)drawStar(s,menu.t);
  drawFox(menu.fox,menu.t);
  ctx.restore();
  ctx.fillStyle='rgba(20,25,90,.18)';ctx.fillRect(0,0,VW,VH);
}

/* ---------------- Hauptschleife ---------------- */
function frame(now){
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
  ctx.setTransform(K,0,0,K,0,0);
  if(G&&(state==='play'||state==='win'||state==='finish')){step(dt/2);step(dt/2);}
  else if(state==='menu'||state==='levels'||state==='scores'){menuStep(dt);updParts(dt);}
  if(G&&(state==='play'||state==='pause'||state==='win'||state==='finish'))drawWorld();else drawMenu();
  requestAnimationFrame(frame);
}

/* ---------------- Größe ---------------- */
function resize(){
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  const w=window.innerWidth,h=window.innerHeight,s=Math.min(w/VW,h/VH);
  stage.style.width=Math.floor(VW*s)+'px';stage.style.height=Math.floor(VH*s)+'px';
  stage.style.fontSize=(s*16)+'px';
  K=Math.min(3,s*(window.devicePixelRatio||1));
  cv.width=Math.round(VW*K);cv.height=Math.round(VH*K);
  const portrait=window.matchMedia&&window.matchMedia('(orientation:portrait) and (max-width:900px)').matches;
  if(portrait&&state==='play')togglePause();
}

/* ---------------- Steuerung ---------------- */
function togglePause(){
  if(state==='play'){setState('pause');inp.left=inp.right=inp.jump=false;}
  else if(state==='pause'){setState('play');last=performance.now();}
}
function toggleMute(){
  save.muted=!save.muted;persist();$('btnMute').textContent=save.muted?'🔇':'🔊';
  if(save.muted)musicStop();else{unlockAudio();musicStart();}
}
function toggleMusic(){
  save.noMusic=!save.noMusic;persist();$('btnMusic').classList.toggle('off',save.noMusic);
  if(save.noMusic)musicStop();else{unlockAudio();musicStart();}
}
const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){
    if(e.code==='Enter'||e.key==='Enter'){e.preventDefault();e.target.blur();submitScore();}
    return;
  }
  unlockAudio();
  const k=keymap[e.code];
  if(k){e.preventDefault();if(k==='jump'&&!inp.jump)inp.jumpPressed=true;inp[k]=true;}
  else if(e.code==='Escape'||e.code==='KeyP'){togglePause();}
  else if(e.code==='KeyM'){toggleMute();}
  else if(e.code==='Enter'){
    if(state==='menu')playMain();
    else if(state==='pause')togglePause();
    else if(state==='win'&&G.idx<LEVELS.length-1)startLevel(G.idx+1,G.mode);
  }
});
addEventListener('keyup',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=keymap[e.code];if(k){e.preventDefault();inp[k]=false;}});
addEventListener('blur',()=>{inp.left=inp.right=inp.jump=false;if(state==='play')togglePause();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(state==='play')togglePause();if(ac&&ac.state==='running')ac.suspend();}
  else if(ac&&ac.state==='suspended'){ac.resume();}
});
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('contextmenu',e=>e.preventDefault());

document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}
    if(k==='jump'&&!inp.jump)inp.jumpPressed=true;inp[k]=true;b.classList.add('down');};
  const up=e=>{e.preventDefault();inp[k]=false;b.classList.remove('down');};
  b.addEventListener('pointerdown',down);
  b.addEventListener('pointerup',up);
  b.addEventListener('pointercancel',up);
  b.addEventListener('lostpointercapture',up);
});

/* ---------------- Menüs ---------------- */
function buildCards(){
  const c=$('cards');c.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const th=lv.th,b=document.createElement('button');b.className='card';
    b.style.background='linear-gradient('+th.sky[0]+','+th.sky[1]+' 58%,'+th.grass+' 58%)';
    const m=save.best[i]||0;
    b.innerHTML='<span class="num">'+(i+1)+'</span><span class="nm">'+lv.name+'</span><span class="med">'+
      [1,2,3].map(k=>'<i class="'+(k<=m?'on':'')+'">★</i>').join('')+'</span>';
    b.addEventListener('click',()=>startLevel(i,'free'));
    c.appendChild(b);
  });
}
function openLevels(){unlockAudio();buildCards();setState('levels');}
function toMenu(){refreshMenu();musicMood(0);setState('menu');}
$('bPlay').addEventListener('click',playMain);
$('bPick').addEventListener('click',openLevels);
$('bScores').addEventListener('click',()=>{unlockAudio();openScores(null);});
$('bNew').addEventListener('click',()=>{
  unlockAudio();
  if(runState()==='done'||window.confirm('Neues Abenteuer starten?\nDein bisheriger Fortschritt im Abenteuer geht dabei verloren.'))newRun();
});
$('bBack').addEventListener('click',toMenu);
$('bResume').addEventListener('click',togglePause);
$('bRestart').addEventListener('click',()=>startLevel(G.idx,G.mode));
$('bMenu1').addEventListener('click',toMenu);
$('bMenu2').addEventListener('click',toMenu);
$('bAgain').addEventListener('click',()=>startLevel(G.idx,G.mode));
$('bNext').addEventListener('click',()=>{if(G.idx<LEVELS.length-1)startLevel(G.idx+1,G.mode);});
$('bSubmit').addEventListener('click',()=>submitScore(false));
$('bSkip').addEventListener('click',()=>submitScore(true));
$('bScoreMenu').addEventListener('click',toMenu);
$('bScoreNew').addEventListener('click',newRun);
$('nameIn').addEventListener('blur',()=>setTimeout(resize,150));
$('btnMusic').addEventListener('click',toggleMusic);
$('btnPause').addEventListener('click',togglePause);
$('btnMute').addEventListener('click',toggleMute);

/* ---------------- Start ---------------- */
const isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
if(isTouch)document.body.classList.add('touch');
$('hintTxt').innerHTML=(isTouch?'Laufen mit ◀ ▶ · Springen mit ▲':'Laufen: ← → oder A D · Springen: Leertaste · Pause: P')+
  '<br>Sammle ⭐, hüpfe Glibbern und Bienen auf den Kopf und erreiche die Zielfahne. Schaffst du alle 15 Welten, kommst du in die Bestenliste!';
$('btnMute').textContent=save.muted?'🔇':'🔊';
$('btnMusic').classList.toggle('off',save.noMusic);
refreshMenu();
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
window.__fuchsi={startLevel,LEVELS,STARS,save,music,musicTick,showFinish,submitScore,openScores,runTotals,refreshMenu,setState,step:(dt)=>step(dt),get G(){return G;},inp,frame,get state(){return state;}};
requestAnimationFrame(frame);
})();
</script>
</body>
